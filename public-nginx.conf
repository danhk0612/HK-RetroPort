# Public requests reach only a read-only catalogue or the visitor's isolated worker.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    server {
        listen 8080;
        set $worker "";
        location = /favicon.ico { return 302 /library/icon.png; }
        location = /_identity {
            internal;
            proxy_pass http://unix:/broker/control.sock:/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Route $request_uri;
            proxy_set_header X-Method $client_method;
            proxy_set_header X-Public-Host $http_host;
            proxy_set_header Origin $http_origin;
        }
        location = /library/ {
            limit_except GET { deny all; }
            set $client_method $request_method;
            auth_request /_identity;
            auth_request_set $identity_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $identity_cookie always;
            add_header Cache-Control "private, no-store" always;
            proxy_pass http://launcher:3000/library/player.html;
        }
        location ~ "^/library/(games$|icon\.png$|storage\.json$|purged$|browser\.(html|js)$|dos\.(html|js)$|wine-screen\.html$|cleanup\.js$|cores/|asset/[a-f0-9]{32}(?:[a-f0-9]{32})?/|media/[a-f0-9]{32}(?:[a-f0-9]{32})?(/|$)|bundle/[a-f0-9]{32}(?:[a-f0-9]{32})?$|settings/[a-f0-9]{32}(?:[a-f0-9]{32})?$)" {
            limit_except GET { deny all; }
            proxy_pass http://launcher:3000;
        }
        location ~ "^/library/(play/[a-f0-9]{32}(?:[a-f0-9]{32})?|stop|apply/[a-f0-9]{32}(?:[a-f0-9]{32})?)$" {
            limit_except POST { deny all; }
            set $client_method $request_method;
            auth_request /_identity;
            auth_request_set $worker $upstream_http_x_worker;
            proxy_set_header Host $http_host;
            proxy_set_header Origin http://$http_host;
            proxy_set_header Cookie "";
            proxy_read_timeout 600s;
            proxy_pass http://unix:/endpoints/$worker/stream.sock:$request_uri;
        }
        location /library { return 403; }
        location = / {
            if ($arg_stream != 1) { return 302 /library/; }
            set $client_method $request_method;
            auth_request /_identity;
            auth_request_set $worker $upstream_http_x_worker;
            proxy_set_header Cookie "";
            proxy_pass http://unix:/endpoints/$worker/stream.sock:/;
        }
        location / {
            set $client_method $request_method;
            auth_request /_identity;
            auth_request_set $worker $upstream_http_x_worker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie "";
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_pass http://unix:/endpoints/$worker/stream.sock:$request_uri;
        }
    }
}
