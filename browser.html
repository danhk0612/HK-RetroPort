<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/library/icon.png">
<title>HK-RetroPort 브라우저 플레이</title>
<style>
  :root { color-scheme: dark; background: #101518; color: #eff5ef; font: 16px system-ui, sans-serif; }
  body { margin: 1rem; }
  header, .tools { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
  header { justify-content: space-between; }
  h1 { margin: 0; font-size: 1.12rem; }
  canvas { display: block; margin: 1rem auto; background: #000; width: min(100%, 48rem); height: auto; image-rendering: pixelated; }
  button, select { font: inherit; font-size: .92rem; padding: .4rem .65rem; }
  label { display: inline-flex; align-items: center; gap: .4rem; }
  #player:fullscreen { background: #101518; padding: 1rem; display: flex; flex-direction: column; }
  #player:fullscreen .viewport { display: grid; place-items: center; flex: 1; min-height: 0; container-type: size; }
  #player:fullscreen canvas { width: min(100cqw, calc(100cqh * var(--screen-aspect))); margin: 0; }
  [hidden] { display: none !important; }
</style>
<main id="player">
  <header>
    <h1 id="title">브라우저 플레이</h1>
    <div class="tools" role="group" aria-label="게임 도구 모음">
      <button id="start" disabled>시작</button>
      <div id="drives" class="tools" aria-label="디스크 교체" hidden></div>
      <button id="sound" aria-pressed="false" hidden>음소거</button>
      <button id="fullscreen" hidden>전체 화면</button>
      <button id="release" onclick="document.exitPointerLock()">마우스 해제</button><button id="stop">종료</button>
    </div>
  </header>
  <p id="status" role="status">게임 파일을 불러오는 중입니다.</p>
  <div class="viewport">
    <canvas width="640" height="400" id="screen" tabindex="0" aria-label="게임 화면"></canvas>
  </div>
</main>
<script type="module" src="/library/browser.js"></script>
