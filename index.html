<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/library/icon.png">
<title>HK-RetroPort 게임 목록</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #101518; color: #eff5ef; }
  body { max-width: 70rem; margin: auto; padding: 1.5rem; }
  h1 { margin: 0 0 1rem; font-size: 2rem; }
  button, input, select { font: inherit; border: 1px solid #536761; border-radius: .35rem; padding: .45rem .7rem; }
  input { width: min(20rem, 100%); background: #182124; }
  button { background: #c7ed9b; color: #182311; cursor: pointer; }
  button:disabled { background: #283431; color: #b9c7c2; cursor: default; }
  a { color: #c7ed9b; }
  .tools, #playing { display: flex; align-items: center; flex-wrap: wrap; gap: .85rem; }
  #playing h2 { flex: 1; font-size: 1.2rem; }
  #status, small { color: #b9c7c2; }
  iframe { width: 100%; height: clamp(25rem, 73vh, 55rem); border: 1px solid #536761; background: #000; }
  ul { padding: 0; list-style: none; border-top: 1px solid #384542; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid #384542; }
  li span, li small { display: block; }
  .actions { display: flex; gap: .4rem; flex-shrink: 0; flex-wrap: wrap; }
  .secondary { background: #273633; color: #eff5ef; }
  dialog { width: min(29rem, calc(100% - 3rem)); border: 1px solid #536761; border-radius: .5rem; background: #182124; }
  dialog::backdrop { background: #080c0dcc; }
  dialog h2 { margin-top: 0; }
  dialog label { display: grid; gap: .25rem; margin: .65rem 0; }
  dialog fieldset { border: 0; padding: 0; margin: 0; }
  dialog input { width: 100%; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html[data-player] :is(#execution, #global-settings, a[href="/library/manage/"]) { display: none; }
</style>
<main>
  <h1><img src="/library/icon.png" width="36" height="36" alt="" style="vertical-align:middle;border-radius:7px"> HK-RetroPort</h1>
  <div class="tools">
    <input type="search" id="search" placeholder="게임 제목 검색" aria-label="게임 제목 검색">
    <label><input type="checkbox" id="ready" style="width:auto"> 실행 설정 있음</label>
    <select id="execution" aria-label="이번 실행 방식">
      <option value="">저장된 실행 방식 사용</option>
      <option value="browser">이번에는 브라우저에서 실행</option>
      <option value="server">이번에는 서버에서 실행</option>
    </select>
    <a href="/library/manage/">게임 관리</a><select id="sort" aria-label="정렬"><option value="ko">가나다순</option><option value="en">알파벳순</option></select><select id="facet" aria-label="분류"></select><select id="value" aria-label="분류 값"></select><button id="global-settings" class="secondary">전체 설정</button>
  </div>
  <p id="status" role="status">로컬 게임을 읽는 중입니다.</p>
  <section id="player" hidden>
    <div id="playing">
      <h2 id="current"></h2>
      <a href="/" target="_blank" rel="noopener">플레이 화면 새 탭</a>
      <button id="stop">종료</button>
    </div>
    <p>게임 화면을 클릭하면 키보드 입력과 소리가 활성화됩니다.</p>
    <iframe title="게임 플레이 화면" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </section>
  <dialog id="info"><h2></h2><div></div><p><button onclick="this.closest('dialog').close()">닫기</button></p></dialog>
  <ul id="games"></ul>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <h2 id="settings-title">설정</h2>
      <label>기본 실행 방식
        <select name="execution">
          <option value="">기본값</option>
          <option value="browser">브라우저 직접 실행</option>
          <option value="server">서버에서 실행</option>
        </select>
      </label>
      <fieldset id="pc98-settings">
        <label>PC-98 메모리 (MB)<input name="pc98_memory" type="number" min="1" max="128"></label>
        <label>PC-98 CPU 배율 (브라우저)<input name="pc98_clock" type="number" min="1" max="32"></label>
      </fieldset>
      <fieldset id="pc88-settings">
        <label>PC-88 CPU 속도 (MHz)<input name="pc88_clock" type="number" min="1" max="16"></label>
      </fieldset>
      <p><small>빈 값은 기본값을 따릅니다. 설정은 다음 실행부터 적용됩니다.</small></p>
      <p id="settings-error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" id="save-settings">저장</button>
        <button type="button" id="cancel-settings" class="secondary">취소</button>
      </div>
    </form>
  </dialog>
</main>
<script>
  const search = document.querySelector('#search');
  const ready = document.querySelector('#ready');
  const execution = document.querySelector('#execution');
  const list = document.querySelector('#games');
  const status = document.querySelector('#status');
  const player = document.querySelector('#player');
  const screen = player.querySelector('iframe');
  const settingsDialog = document.querySelector('#settings-dialog');
  const settingsForm = document.querySelector('#settings-form');
  const settingsError = document.querySelector('#settings-error');
  const saveButton = document.querySelector('#save-settings');
  let games = [];
  let busy = false;
  let settingsScope;
  let settingsVersion = 0;

  const facet=document.querySelector('#facet'), value=document.querySelector('#value'), sort=document.querySelector('#sort');
  for(const [k,label] of Object.entries({platform:'기종',genre:'한글 장르',note:'영문 장르',publisher:'제작사',language:'언어',year:'발매 시기',region:'발매 지역',archived:'압축파일 보유',compression:'NTFS 압축',engine:'원본 실행기'}))facet.add(new Option(label,k));
  function updateFacet(){const before=value.value;value.replaceChildren(new Option('전체',''));for(const v of [...new Set(games.map(g=>g[facet.value]).filter(Boolean))].sort())value.add(new Option(v,v));if([...value.options].some(o=>o.value===before))value.value=before;render()}
  facet.onchange=updateFacet;value.onchange=sort.onchange=()=>render();
  function render() {
    const term = search.value.trim().toLocaleLowerCase();
    const results = games.filter(game =>
      (!ready.checked || game.playable) && (!value.value || game[facet.value]===value.value) && [game.title,game.english,game.work].some(t=>t?.toLocaleLowerCase().includes(term))
    );
    const titleOf=g=>sort.value==='en'?(g.english||g.title):g.title;
    results.sort((a,b)=>titleOf(a).localeCompare(titleOf(b),sort.value)||Number(b.platform==='dos'&&b.language==='한글')-Number(a.platform==='dos'&&a.language==='한글'));
    status.textContent = `${results.length.toLocaleString()}개 / 전체 ${games.length.toLocaleString()}개`;
    const groups=new Map();
    const normalize=s=>s.replace(/\[특화[^\]]*\]|<한글>/g,'').replace(/[\s()（）·]/g,'').toLowerCase();
    for(const g of results){const key=normalize(g.work||g.title);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(g)}
    const rows = [...groups.values()].map(variants => {
      const rank=g=>(g.language==='한글'?2:0)+(g.verification?.includes('한글')?4:0)+(g.platform==='dos'&&g.language==='한글'?1:0);
      variants.sort((a,b)=>rank(b)-rank(a));
      let game=variants[0];
      const row = document.createElement('li');
      const description = document.createElement('div');
      const title = document.createElement('span');
      title.textContent = titleOf(game);
      const details = document.createElement('small');
      details.textContent = [game.platform.toUpperCase(),game.language,game.verification,game.genre, game.note === 'ETC' ? '' : game.note].filter(Boolean).join(' · ');
      description.append(title, details);
      const button = document.createElement('button');
      button.textContent = playLabel(game);
      button.disabled = !game.playable;
      button.addEventListener('click', () => play(game));
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.append(button);
      if(variants.length>1){
        const select=document.createElement('select');select.setAttribute('aria-label','판본 선택');
        variants.forEach((v,i)=>select.add(new Option(v.platform.toUpperCase()+' · '+(v.language||'언어 미확인')+' · '+(i+1),i)));
        select.onchange=()=>{game=variants[select.selectedIndex];title.textContent=titleOf(game);details.textContent=[game.platform,game.genre,game.language,game.verification].filter(Boolean).join(' · ');button.disabled=!game.playable;button.textContent=playLabel(game)};
        actions.prepend(select);
      }
      const info=document.createElement('button');info.className='secondary';info.textContent='정보';
      info.onclick=()=>{const d=document.querySelector('#info'),body=d.querySelector('div');
        d.querySelector('h2').textContent=game.title;body.replaceChildren();
        const p=document.createElement('p');p.textContent=[game.english,game.publisher,game.year,game.region,game.description].filter(Boolean).join(' · ');body.append(p);
        const url=n=>'/library/asset/'+game.id+'/'+n.split('/').map(encodeURIComponent).join('/');
        for(const n of [game.icon,...(game.screenshots||'').split('\n')].filter(Boolean)){const img=new Image();img.src=url(n);img.alt=n;img.style.maxWidth='100%';body.append(img)}
        if(game.manual){const a=document.createElement('a');a.textContent='매뉴얼 열기';a.href=url(game.manual);a.target='_blank';a.rel='noopener';body.append(a)}
        d.showModal()};actions.append(info);
      if (game.playable && !document.documentElement.hasAttribute("data-player")) {
        const settings = document.createElement('button');
        settings.className = 'secondary';
        settings.textContent = '설정';
        settings.addEventListener('click', () => openSettings(game));
        actions.append(settings);
      }
      row.append(description, actions);
      return row;
    });
    list.replaceChildren(...rows);
  }

  async function act(path, data) {
    const options = {method: 'POST'};
    if (data !== undefined) {
      options.headers = {'Content-Type': 'application/json'};
      options.body = JSON.stringify(data);
    }
    const response = await fetch(path, options);
    const body = await response.json();
    if (!response.ok) throw new Error(body.error);
  }

  function playLabel(game) {
    if (game.playable) return '플레이';
    if (game.blocked) return '운영자 확인 필요';
    return game.needs_core ? '실행기 준비 중' : '게임 파일 없음';
  }
  async function play(game) {
    if (busy || !game.playable) return;
    busy = true;
    try {
      if (game.browser && (execution.value || game.execution) === 'browser') {
        if (!player.hidden) await act('/library/stop');
        location.assign('/library/'+(game.platform==='dos'?'dos.html':'browser.html')+'?game='+game.id);
        return;
      }
      await act('/library/play/' + game.id);
      document.querySelector('#current').textContent = game.title;
      const entry = game.commands?.toLowerCase();
      const gameInput = game.platform === 'windows' && (game.engine === 'Wine' || entry === 'devilf.exe');
      const stream = gameInput ? '/library/wine-screen.html?game=' + encodeURIComponent(entry) : '/?stream=1';
      player.querySelector('p').textContent = gameInput && entry !== 'mystic.exe'
        ? '게임 화면을 클릭하면 입력이 활성화됩니다. 마우스 고정은 Esc로 해제합니다.'
        : '게임 화면을 클릭하면 키보드 입력과 소리가 활성화됩니다.';
      if (screen.getAttribute('src') !== stream) screen.src = stream;
      document.querySelector('#playing a').href = stream;
      player.hidden = false;
      player.scrollIntoView();
    } catch (error) {
      status.textContent = error.message;
    } finally {
      busy = false;
    }
  }

  document.querySelector('#stop').addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    try {
      await act('/library/stop');
      player.hidden = true;
      screen.removeAttribute('src');
    } catch (error) {
      status.textContent = error.message;
    } finally {
      busy = false;
    }
  });
  search.addEventListener('input', render);
  ready.addEventListener('change', render);

  async function loadGames() {
    const response = await fetch('/library/games');
    if (!response.ok) throw new Error('게임 목록을 불러오지 못했습니다.');
    games = await response.json();
    updateFacet();
  }

  async function openSettings(game) {
    if (settingsDialog.open) return;
    const version = ++settingsVersion;
    settingsScope = game?.id ?? 'global';
    document.querySelector('#settings-title').textContent = game ? game.title + ' 설정' : '전체 설정';
    for (const engine of ['pc98', 'pc88']) {
      const fieldset = document.querySelector('#' + engine + '-settings');
      fieldset.hidden = fieldset.disabled = Boolean(game && engine!==game.platform);
    }
    settingsForm.reset();
    settingsError.hidden = true;
    saveButton.disabled = true;
    settingsDialog.showModal();
    try {
      const response = await fetch('/library/settings/' + settingsScope);
      if (!response.ok) throw new Error('저장된 설정을 불러오지 못했습니다.');
      const {values, defaults} = await response.json();
      if (version !== settingsVersion || !settingsDialog.open) return;
      for (const input of settingsForm.querySelectorAll('input, select')) {
        input.value = values[input.name] ?? '';
        if (input.type === 'number') input.placeholder = defaults[input.name] ?? '에뮬레이터 기본값';
      }
      const modes = {browser: '브라우저 직접 실행', server: '서버에서 실행'};
      const defaultMode = modes[defaults.execution ?? 'browser'];
      settingsForm.elements.execution.options[0].textContent = '기본값 · ' + defaultMode;
      saveButton.disabled = false;
    } catch (error) {
      if (version !== settingsVersion || !settingsDialog.open) return;
      settingsError.textContent = error.message;
      settingsError.hidden = false;
    }
  }

  document.querySelector('#global-settings').onclick = () => openSettings();
  document.querySelector('#cancel-settings').onclick = () => settingsDialog.close();
  settingsForm.onsubmit = async event => {
    event.preventDefault();
    const version = settingsVersion;
    saveButton.disabled = true;
    settingsError.hidden = true;
    const values = {};
    for (const [key, value] of new FormData(settingsForm)) {
      if (value !== '') values[key] = key === 'execution' ? value : Number(value);
    }
    try {
      const existing=await (await fetch('/library/settings/'+settingsScope)).json();
      const merged={...existing.values}; for(const el of settingsForm.querySelectorAll('input,select'))if(!el.disabled)delete merged[el.name];
      await act('/library/settings/' + settingsScope, {...merged,...values});
      await loadGames();
      if (version === settingsVersion && settingsDialog.open) settingsDialog.close();
      status.textContent = '설정을 저장했습니다. ' + status.textContent;
    } catch (error) {
      if (version === settingsVersion && settingsDialog.open) {
        settingsError.textContent = error.message;
        settingsError.hidden = false;
      }
    } finally {
      if (version === settingsVersion) saveButton.disabled = false;
    }
  };
  import('/library/cleanup.js').then(m=>m.clean()).catch(console.error);
  loadGames().then(()=>{const id=new URLSearchParams(location.search).get('play');if(id){const g=games.find(g=>g.id===id);if(g)play(g)}}).catch(error => { status.textContent = error.message; });
</script>
